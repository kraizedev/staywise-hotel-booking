name: Import hotel booking source
on:
  push:
    paths:
      - source-chunks/part-08.b64
    branches:
      - main
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reassemble and extract source archive
        run: |
          set -euo pipefail
          test "$(find source-chunks -name 'part-*.b64' | wc -l)" -eq 8
          cat source-chunks/part-*.b64 | base64 -d > hotel-booking.zip
          unzip -q hotel-booking.zip
          test -f hotel-booking/package.json
          cp -a hotel-booking/. .
          rm -rf hotel-booking source-chunks hotel-booking.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import hotel booking application source"
          git push